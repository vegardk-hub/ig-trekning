<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f2efe7">
<meta name="description" content="Sudoku med automatiske blyantmerker og hint som forklarer løseteknikkene.">
<title>Sudoku</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles.css">
<!-- Før stilene rekker å male: setter data-tema på <html>, ellers blinker
     standardfargene til for den som har valgt et annet oppsett. -->
<script src="js/tema.js"></script>
</head>
<body>

<div class="app">

  <header class="topp">
    <h1>Sudoku</h1>
    <div class="meta">
      <span id="meta-nivaa">–</span>
      <span class="prikk">·</span>
      <span id="meta-igjen">–</span>
      <span class="prikk">·</span>
      <span id="meta-tid">0:00</span>
    </div>
  </header>

  <!-- Sidepanelene fylles av app.js og er like, så alt kan nås med begge tomler
       når telefonen ligger. Stående vises bare den venstre, under brettet. -->
  <div class="spilleflate">

    <!-- Hint og melding bor i venstre panel. Stående faller de rett under
         brettet slik de alltid har gjort; liggende tar de plassen der
         verktøyknappene ellers ville stått, i stedet for å legge seg over
         brettet og skjule nettopp rutene hintet peker på. -->
    <!-- ◐ bor her, ikke i toppen av .app: liggende skal den stå i flyten ved
         siden av appnavnet, der den er lett å treffe uansett hvor bred spalta
         blir. Stående er den absolutt plassert og havner i hjørnet som før. -->
    <div class="side venstre">
      <div class="sidetopp">
        <span class="sidetittel">Sudoku</span>
        <button id="btn-tema" class="temaknapp" aria-label="Fargeoppsett">◐</button>
      </div>

      <div class="forklaring">
        <div id="hint" class="hint" hidden>
          <div class="hint-topp">
            <span id="hint-navn" class="hint-navn"></span>
            <button id="hint-lukk" class="ikonknapp" aria-label="Lukk hint">&times;</button>
          </div>
          <p id="hint-tekst" class="hint-tekst"></p>
          <div class="hint-knapper">
            <button id="hint-mer" class="knapp">Vis hvor</button>
            <button id="hint-bruk" class="knapp primaer">Bruk</button>
          </div>
        </div>

        <div id="melding" class="melding" hidden></div>
      </div>

      <div class="tall"></div>
      <div class="verktoy"></div>
    </div>

    <div id="brett" class="brett" role="grid" aria-label="Sudokurutenett"></div>

    <!-- Nivå og teller står her liggende, over de store tallene: det gir
         appnavnet hele venstre spalte. aria-hidden ligger på talltastene
         alene — de er en kopi av settet til venstre, mens telleren og
         verktøyene her er de eneste synlige liggende. -->
    <div class="side hoyre">
      <div class="sidetopp">
        <span id="side-nivaa" class="side-nivaa"></span>
        <span id="side-igjen" class="side-igjen"></span>
        <span id="side-tid" class="side-tid"></span>
      </div>
      <div class="tall" aria-hidden="true"></div>
      <div class="verktoy"></div>
    </div>

  </div>

  <p id="versjon" class="versjon" hidden></p>

</div>

<div id="nytt-panel" class="modal" hidden>
  <div class="modal-kort">
    <h2>Nytt spill</h2>
    <p class="modal-under">Vanskelighetsgraden bestemmes av hvilke løseteknikker som trengs.</p>
    <div class="nivaaliste">
      <button class="nivaaknapp" data-nivaa="lett">
        <strong>Lett</strong><span>Bare nakne og skjulte enere</span>
      </button>
      <button class="nivaaknapp" data-nivaa="middels">
        <strong>Middels</strong><span>Låste kandidater</span>
      </button>
      <button class="nivaaknapp" data-nivaa="vanskelig">
        <strong>Vanskelig</strong><span>Nakne og skjulte par</span>
      </button>
      <button class="nivaaknapp" data-nivaa="ekspert">
        <strong>Ekspert</strong><span>Tripler, X-Wing, XY-Wing og sverdfisk</span>
      </button>
    </div>
    <!-- To knapper på én rad, ikke to rader: kortet har fire nivåknapper over
         seg og skal fortsatt få plass på en liggende telefon uten skrolling. -->
    <div class="modal-knapper">
      <button id="nytt-stat" class="knapp">Statistikk</button>
      <button id="nytt-avbryt" class="knapp">Avbryt</button>
    </div>
  </div>
</div>

<div id="tema-panel" class="modal" hidden>
  <div class="modal-kort">
    <!-- ✕ i hjørnet: valget slår inn med en gang du trykker på det, så her er
         det ingenting å bekrefte — man vil bare ut igjen. -->
    <div class="modal-topp">
      <h2>Fargeoppsett</h2>
      <button id="tema-x" class="ikonknapp modal-x" aria-label="Lukk">&times;</button>
    </div>
    <p class="modal-under">Velg det som er lettest å se der du sitter.</p>
    <div id="temaliste" class="temaliste" role="radiogroup" aria-label="Fargeoppsett"></div>
    <button id="tema-lukk" class="knapp bred">Lukk</button>
  </div>
</div>

<div id="stat-panel" class="modal" hidden>
  <div class="modal-kort">
    <div class="modal-topp">
      <h2>Statistikk</h2>
      <button id="stat-x" class="ikonknapp modal-x" aria-label="Lukk">&times;</button>
    </div>
    <p class="modal-under">Bare brett du har løst helt, telles med.</p>
    <div id="statliste" class="statliste"></div>
    <!-- «Nullstill» krever to trykk. Den sletter noe som ikke kan hentes fram
         igjen, og står rett ved siden av knappen man egentlig var ute etter. -->
    <div class="modal-knapper">
      <button id="stat-null" class="knapp">Nullstill</button>
      <button id="stat-lukk" class="knapp">Lukk</button>
    </div>
  </div>
</div>

<div id="jobber" class="modal" hidden>
  <div class="modal-kort smal">
    <div class="spinner"></div>
    <p id="jobber-tekst">Lager puslespill …</p>
  </div>
</div>

<div id="ferdig" class="modal" hidden>
  <div class="modal-kort smal">
    <div class="pokal">★</div>
    <h2>Løst!</h2>
    <p id="ferdig-tid" class="ferdig-tid"></p>
    <p id="ferdig-rekord" class="ferdig-rekord" hidden>Ny rekord på dette nivået!</p>
    <p id="ferdig-tekst" class="modal-under"></p>
    <button id="ferdig-nytt" class="knapp primaer bred">Nytt spill</button>
    <button id="ferdig-lukk" class="knapp bred">Se på brettet</button>
  </div>
</div>

<script src="js/statistikk.js"></script>
<script src="js/core.js"></script>
<script src="js/solver.js"></script>
<script src="js/generator.js"></script>
<script src="js/app.js"></script>
</body>
</html>
