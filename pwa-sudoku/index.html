<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f2efe7">
<meta name="description" content="Sudoku med automatiske blyantmerker og hint som forklarer løseteknikkene.">
<title>Sudoku</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles.css">
<!-- Før stilene rekker å male: setter data-tema på <html>, ellers blinker
     standardfargene til for den som har valgt et annet oppsett. -->
<script src="js/tema.js"></script>
</head>
<body>

<div class="app">

  <button id="btn-tema" class="temaknapp" aria-label="Fargeoppsett">◐</button>

  <header class="topp">
    <h1>Sudoku</h1>
    <div class="meta">
      <span id="meta-nivaa">–</span>
      <span class="prikk">·</span>
      <span id="meta-igjen">–</span>
    </div>
  </header>

  <!-- Sidepanelene fylles av app.js og er like, så alt kan nås med begge tomler
       når telefonen ligger. Stående vises bare den venstre, under brettet. -->
  <div class="spilleflate">

    <!-- Hint og melding bor i venstre panel. Stående faller de rett under
         brettet slik de alltid har gjort; liggende tar de plassen der
         verktøyknappene ellers ville stått, i stedet for å legge seg over
         brettet og skjule nettopp rutene hintet peker på. -->
    <div class="side venstre">
      <div class="sidetopp">
        <span class="sidetittel">Sudoku</span>
        <span id="side-meta"></span>
      </div>

      <div class="forklaring">
        <div id="hint" class="hint" hidden>
          <div class="hint-topp">
            <span id="hint-navn" class="hint-navn"></span>
            <button id="hint-lukk" class="ikonknapp" aria-label="Lukk hint">&times;</button>
          </div>
          <p id="hint-tekst" class="hint-tekst"></p>
          <div class="hint-knapper">
            <button id="hint-mer" class="knapp">Vis hvor</button>
            <button id="hint-bruk" class="knapp primaer">Bruk</button>
          </div>
        </div>

        <div id="melding" class="melding" hidden></div>
      </div>

      <div class="tall"></div>
      <div class="verktoy"></div>
    </div>

    <div id="brett" class="brett" role="grid" aria-label="Sudokurutenett"></div>

    <!-- Tom topp: holder av plassen ◐-knappen legger seg i, så begge sidene
         får samme høyde og knappene står rett overfor hverandre. -->
    <div class="side hoyre" aria-hidden="true">
      <div class="sidetopp"></div>
      <div class="tall"></div>
      <div class="verktoy"></div>
    </div>

  </div>

  <p id="versjon" class="versjon" hidden></p>

</div>

<div id="nytt-panel" class="modal" hidden>
  <div class="modal-kort">
    <h2>Nytt spill</h2>
    <p class="modal-under">Vanskelighetsgraden bestemmes av hvilke løseteknikker som trengs.</p>
    <div class="nivaaliste">
      <button class="nivaaknapp" data-nivaa="lett">
        <strong>Lett</strong><span>Bare nakne og skjulte enere</span>
      </button>
      <button class="nivaaknapp" data-nivaa="middels">
        <strong>Middels</strong><span>Låste kandidater</span>
      </button>
      <button class="nivaaknapp" data-nivaa="vanskelig">
        <strong>Vanskelig</strong><span>Nakne og skjulte par</span>
      </button>
      <button class="nivaaknapp" data-nivaa="ekspert">
        <strong>Ekspert</strong><span>Tripler, X-Wing, XY-Wing og sverdfisk</span>
      </button>
    </div>
    <button id="nytt-avbryt" class="knapp bred">Avbryt</button>
  </div>
</div>

<div id="tema-panel" class="modal" hidden>
  <div class="modal-kort">
    <h2>Fargeoppsett</h2>
    <p class="modal-under">Velg det som er lettest å se der du sitter.</p>
    <div id="temaliste" class="temaliste" role="radiogroup" aria-label="Fargeoppsett"></div>
    <button id="tema-lukk" class="knapp bred">Lukk</button>
  </div>
</div>

<div id="jobber" class="modal" hidden>
  <div class="modal-kort smal">
    <div class="spinner"></div>
    <p id="jobber-tekst">Lager puslespill …</p>
  </div>
</div>

<div id="ferdig" class="modal" hidden>
  <div class="modal-kort smal">
    <div class="pokal">★</div>
    <h2>Løst!</h2>
    <p id="ferdig-tekst" class="modal-under"></p>
    <button id="ferdig-nytt" class="knapp primaer bred">Nytt spill</button>
    <button id="ferdig-lukk" class="knapp bred">Se på brettet</button>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/solver.js"></script>
<script src="js/generator.js"></script>
<script src="js/app.js"></script>
</body>
</html>
