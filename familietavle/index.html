<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e141b">
<meta name="robots" content="noindex">
<title>Familietavla</title>
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="icon" href="ikon.svg?v=4" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

<main id="tavle" class="tavle" hidden>
  <header class="topp">
    <div class="klokke">
      <div id="tid" class="tid">--:--</div>
      <div id="dato" class="dato"></div>
    </div>
    <div id="vaer" class="vaer"></div>
  </header>

  <div id="innhold" class="innhold">
    <div class="hoved">
      <section class="kort idag">
        <h2>I dag</h2>
        <div id="idag" class="personrad"></div>
      </section>

      <section class="kort neste">
        <h2>De neste dagene</h2>
        <div id="neste" class="dagrad"></div>
      </section>
    </div>

    <aside id="side" class="side" hidden>
      <section id="middagKort" class="kort" hidden>
        <h2>Middag</h2>
        <ol id="middag" class="middag"></ol>
      </section>
      <section id="bursdagKort" class="kort" hidden>
        <h2>Bursdager</h2>
        <ul id="bursdager" class="bursdager"></ul>
      </section>
    </aside>
  </div>

  <footer class="bunn">
    <div id="personer" class="personer"></div>
    <div id="tomming" class="tomming" hidden></div>
    <button id="lekserKnapp" class="lekserknapp" type="button" hidden>Lekser</button>
    <div id="status" class="status"></div>
    <button id="meny" class="meny" type="button" aria-label="Innstillinger">⋯</button>
  </footer>
</main>

<section id="oppsett" class="oppsett" hidden>
  <form id="oppsettSkjema" class="oppsett-kort">
    <h1>Familietavla</h1>
    <p>Skriv inn passfrasen fra GitHub-hemmeligheten <code>FAMILIETAVLE_PASSFRASE</code>.
      Den lagres bare på dette nettbrettet.</p>
    <input id="passfrase" type="password" autocomplete="off" autocapitalize="none"
      spellcheck="false" placeholder="Passfrase">
    <button type="submit">Åpne tavla</button>
    <p id="oppsettMelding" class="melding" role="status"></p>
    <p class="lite"><a href="?demo">Se et eksempel med oppdiktet familie</a></p>
    <p class="lite"><button id="glem" type="button" class="lenkeknapp" hidden>Glem passfrasen på dette nettbrettet</button></p>
  </form>
</section>

<section id="lekser" class="lekser" hidden aria-labelledby="lekserTittel">
  <header class="lekser-topp">
    <h1 id="lekserTittel">Lekser</h1>
    <div id="lekserBarn" class="faner" role="tablist"></div>
    <p id="lekserStatus" class="lekser-status" role="status"></p>
    <button id="lekserLukk" class="lukk" type="button">Tilbake til tavla</button>
  </header>
  <div id="lekserUke" class="ukelekser"></div>
  <div id="lekserDager" class="lekserdager"></div>
  <canvas id="konfetti" class="konfetti" aria-hidden="true"></canvas>
</section>

<div id="natt" class="natt" hidden></div>

<script src="js/kalender.js?v=4"></script>
<script src="js/krypto.js?v=4"></script>
<script src="js/vaer.js?v=4"></script>
<script src="js/ukeplan.js?v=4"></script>
<script src="js/demo.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
