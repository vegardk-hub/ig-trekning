<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprellemaskinen</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sprell">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <h1>Sprellemaskinen</h1>

  <!-- Ett barn om gangen, og navnet står i setningen. Knappene her sier hvem
       oppdraget gjelder – og hvilke oppdrag som er med i trekningen. -->
  <div class="tur" role="group" aria-label="Hvem sin tur er det?">
    <button type="button" class="barn" data-nr="0" aria-pressed="false"></button>
    <button type="button" class="barn" data-nr="1" aria-pressed="false"></button>
  </div>

  <!-- aria-live gjør at en skjermleser sier den nye setningen når den byttes.
       Selve teksten er stor nok til å leses høyt fra andre siden av rommet. -->
  <p id="oppdrag" aria-live="polite">Trykk på knappen for å få et oppdrag.</p>
  <p id="teller" class="teller"></p>

  <div class="knapper">
    <button id="trekk" type="button" class="stor">Nytt oppdrag</button>
    <button id="les" type="button" disabled>Les opp</button>
  </div>

  <p id="talebeskjed" class="beskjed" role="status"></p>

  <fieldset class="valg">
    <legend>Barna</legend>
    <div class="barnrad">
      <label class="navn">Navn <input type="text" id="navn-0" autocomplete="off" maxlength="20"></label>
      <label class="alder">Alder <input type="number" id="alder-0" min="3" max="16" inputmode="numeric"></label>
    </div>
    <div class="barnrad">
      <label class="navn">Navn <input type="text" id="navn-1" autocomplete="off" maxlength="20"></label>
      <label class="alder">Alder <input type="number" id="alder-1" min="3" max="16" inputmode="numeric"></label>
    </div>
  </fieldset>

  <fieldset class="valg">
    <legend>Innstillinger</legend>
    <label><input type="checkbox" id="kun-her"> Bare oppdrag der jeg står</label>
    <label><input type="checkbox" id="autoles"> Les opp automatisk</label>
  </fieldset>
</main>
<script src="js/oppdrag.js"></script>
<script src="js/tale.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
